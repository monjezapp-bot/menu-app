<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>اختبار الدخول</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { font-family: sans-serif; margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #f5f5f5; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
    .card { background: white; border-radius: 16px; padding: 32px; width: 100%; max-width: 360px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
    h1 { text-align: center; margin-bottom: 24px; color: #333; font-size: 20px; }
    input { width: 100%; border: 1px solid #ddd; border-radius: 10px; padding: 12px 16px; font-size: 14px; margin-bottom: 12px; direction: ltr; }
    button { width: 100%; background: #FF6B00; color: white; border: none; border-radius: 10px; padding: 14px; font-size: 16px; font-weight: bold; cursor: pointer; }
    #result { margin-top: 16px; padding: 12px; border-radius: 10px; font-size: 13px; white-space: pre-wrap; word-break: break-all; display: none; }
    .success { background: #f0fff4; color: #276749; border: 1px solid #9ae6b4; }
    .error { background: #fff5f5; color: #c53030; border: 1px solid #feb2b2; }
  </style>
</head>
<body>
<div class="card">
  <h1>🔐 اختبار الدخول</h1>
  <input id="email" type="email" placeholder="الإيميل" value="admin@ibn-hamido.com" />
  <input id="pass" type="password" placeholder="كلمة المرور" />
  <button onclick="testLogin()">اختبار الدخول</button>
  <div id="result"></div>
</div>

<script>
const { createClient } = supabase
const db = createClient(
  'https://pcmyugeqveyjnappulng.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBjbXl1Z2VxdmV5am5hcHB1bG5nIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODExNjU0NDAsImV4cCI6MjA5Njc0MTQ0MH0.uwn0X4CvNRW38FGh_0rYD9KjBRM19CydXucfBsCDYeo'
)

async function testLogin() {
  const result = document.getElementById('result')
  result.style.display = 'block'
  result.className = ''
  result.textContent = 'جاري الاتصال...'

  try {
    const email = document.getElementById('email').value.trim()
    const pass  = document.getElementById('pass').value

    const { data, error } = await db.auth.signInWithPassword({ email, password: pass })

    if (error) {
      result.className = 'error'
      result.textContent = '❌ خطأ:\n' + error.message + '\n\nStatus: ' + error.status
      return
    }

    if (data.session) {
      result.className = 'success'
      result.textContent = '✅ تم الدخول بنجاح!\n\nUser ID: ' + data.user.id + '\n\nالتوجه للداشبورد...'
      setTimeout(() => {
        window.location.href = 'dashboard.html'
      }, 2000)
    }
  } catch(e) {
    result.className = 'error'
    result.textContent = '❌ خطأ غير متوقع:\n' + e.message
  }
}
</script>
</body>
</html>
