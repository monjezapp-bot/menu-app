<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>منيوز — اطلب من مطعمك المفضل</title>

<!-- ── PWA ── -->
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#0d631b" />
<link rel="apple-touch-icon" href="icon-192.png" />

<!-- ── Libraries ── -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />

<!-- ── نفس نظام الألوان والتوكينز المعتمد لهوية منيوز (مستخرج من تصميم Stitch) ── -->
<script id="tailwind-config">
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          "primary":                  "#0d631b",
          "on-primary":                "#ffffff",
          "primary-container":         "#2e7d32",
          "on-primary-container":      "#cbffc2",
          "secondary":                 "#9f4200",
          "on-secondary":              "#ffffff",
          "secondary-container":       "#fd6c00",
          "on-secondary-container":    "#562000",
          "background":                "#f9f9fc",
          "on-background":             "#1a1c1e",
          "surface":                   "#f9f9fc",
          "surface-container-lowest":  "#ffffff",
          "surface-container-low":     "#f3f3f6",
          "surface-container":         "#eeeef0",
          "surface-container-high":    "#e8e8ea",
          "on-surface":                "#1a1c1e",
          "on-surface-variant":        "#40493d",
          "outline":                   "#707a6c",
          "outline-variant":           "#bfcaba",
        },
        borderRadius: { DEFAULT: "0.25rem", lg: "0.5rem", xl: "0.75rem", full: "9999px" },
        fontFamily: { sans: ["Cairo", "sans-serif"] },
      },
    },
  }
</script>
<style>
  body { font-family: 'Cairo', sans-serif; }
  .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; font-size: 22px; }
  .hidden { display: none !important; }
  .skeleton { background: linear-gradient(90deg, #ececec 25%, #f6f6f6 37%, #ececec 63%); background-size: 400% 100%; animation: skeleton-loading 1.4s ease infinite; }
  @keyframes skeleton-loading { 0% { background-position: 100% 50%; } 100% { background-position: 0 50%; } }
  ::-webkit-scrollbar { display: none; }
</style>
</head>
<body class="bg-background text-on-surface antialiased">

<!-- ══════════════════════════════════════════
     LOADING STATE
══════════════════════════════════════════ -->
<div id="home-loading" class="max-w-[480px] mx-auto min-h-screen bg-background">
  <header class="bg-primary px-4 pt-8 pb-6 rounded-b-3xl">
    <h1 class="text-white text-xl font-extrabold">منيوز</h1>
    <p class="text-white/80 text-xs font-semibold mt-1">اطلب من مطعمك المفضل في دقايق</p>
  </header>
  <div class="flex gap-3 px-4 -mt-4 overflow-hidden">
    <div class="skeleton w-20 h-16 rounded-xl flex-shrink-0"></div>
    <div class="skeleton w-20 h-16 rounded-xl flex-shrink-0"></div>
    <div class="skeleton w-20 h-16 rounded-xl flex-shrink-0"></div>
  </div>
  <div class="p-4 space-y-3">
    <div class="skeleton h-48 rounded-xl"></div>
    <div class="skeleton h-48 rounded-xl"></div>
    <div class="skeleton h-48 rounded-xl"></div>
  </div>
</div>

<!-- ══════════════════════════════════════════
     HOME STATE
══════════════════════════════════════════ -->
<div id="home-app" class="max-w-[480px] mx-auto min-h-screen bg-background hidden pb-24">

  <!-- Top App Bar + Search (نفس ستايل السيرش بار الدائري من تصميم Stitch) -->
  <header class="bg-primary px-4 pt-8 pb-9 rounded-b-3xl shadow-sm">
    <h1 class="text-white text-xl font-extrabold">منيوز</h1>
    <p class="text-white/80 text-xs font-semibold mt-1 mb-4">اطلب من مطعمك المفضل في دقايق</p>
    <div class="flex items-center gap-2 bg-surface-container-lowest rounded-full h-11 px-4">
      <span class="material-symbols-outlined text-on-surface-variant" style="font-size:20px">search</span>
      <input id="home-search" oninput="onSearchInput(this.value)" class="bg-transparent border-none outline-none focus:ring-0 text-sm w-full text-right placeholder:text-outline" placeholder="دوّر على مطعم أو أكلة..." type="text" />
    </div>
  </header>

  <!-- 1) Type Tabs (تصنيفات) -->
  <div id="home-type-tabs" class="flex gap-4 overflow-x-auto px-4 pt-5 pb-1"></div>

  <!-- 2) Banners (إعلانات وعروض) -->
  <div id="home-banners-wrap" class="hidden px-4 pt-4">
    <div id="home-banners" class="flex gap-3 overflow-x-auto snap-x snap-mandatory"></div>
  </div>

  <!-- 3) متاجر اشتريت منها -->
  <div id="home-bought-before-wrap" class="hidden pt-5">
    <h2 class="px-4 text-sm font-extrabold text-on-surface mb-2">🛍️ متاجر اشتريت منها</h2>
    <div id="home-bought-before" class="flex gap-3 overflow-x-auto px-4"></div>
  </div>

  <!-- 4) الأكثر مبيعًا -->
  <div id="home-best-sellers-wrap" class="hidden pt-5">
    <h2 class="px-4 text-sm font-extrabold text-on-surface mb-2">🔥 الأكثر مبيعًا</h2>
    <div id="home-best-sellers" class="flex gap-3 overflow-x-auto px-4"></div>
  </div>

  <!-- 5) عروض -->
  <div id="home-offers-wrap" class="hidden pt-5">
    <h2 class="px-4 text-sm font-extrabold text-on-surface mb-2">🏷️ عروض</h2>
    <div id="home-offers" class="flex gap-3 overflow-x-auto px-4"></div>
  </div>

  <!-- 6) المتاجر الأقرب إليك (فلاتر + شبكة) -->
  <div class="pt-5">
    <h2 class="px-4 text-sm font-extrabold text-on-surface mb-2">📍 الأقرب إليك</h2>
    <div id="home-filters" class="flex gap-2 overflow-x-auto px-4 pt-1 pb-1"></div>
    <div id="home-grid" class="grid grid-cols-1 gap-4 px-4 pt-3"></div>
  </div>

  <!-- 7) نقترح لك -->
  <div id="home-recommended-wrap" class="hidden pt-5 pb-4">
    <h2 class="px-4 text-sm font-extrabold text-on-surface mb-2">✨ نقترح لك</h2>
    <div id="home-recommended" class="flex gap-3 overflow-x-auto px-4"></div>
  </div>
</div>

<!-- ══════════════════════════════════════════
     ORDERS TAB (طلباتك — عبر كل المطاعم)
══════════════════════════════════════════ -->
<div id="home-tab-orders" class="max-w-[480px] mx-auto min-h-screen bg-background hidden pb-24">
  <header class="bg-primary px-4 pt-8 pb-5"><h1 class="text-white text-lg font-extrabold">طلباتك</h1></header>
  <div id="orders-list" class="p-4 space-y-3"></div>
</div>

<!-- ══════════════════════════════════════════
     WALLET TAB (محفظتك — رصيد موحّد على كل منيوز)
══════════════════════════════════════════ -->
<div id="home-tab-wallet" class="max-w-[480px] mx-auto min-h-screen bg-background hidden pb-24">
  <header class="bg-primary px-4 pt-8 pb-5"><h1 class="text-white text-lg font-extrabold">محفظتك</h1></header>
  <div id="wallet-content" class="p-4"></div>
</div>

<!-- ══════════════════════════════════════════
     ACCOUNT TAB (حسابك)
══════════════════════════════════════════ -->
<div id="home-tab-account" class="max-w-[480px] mx-auto min-h-screen bg-background hidden pb-24">
  <header class="bg-primary px-4 pt-8 pb-5"><h1 class="text-white text-lg font-extrabold">حسابك</h1></header>
  <div id="account-content" class="p-4"></div>
</div>

<!-- ══════════════════════════════════════════
     BOTTOM NAV (ثابت — نفس فكرة طلبات: حسابك / المحفظة / طلباتك / الرئيسية)
══════════════════════════════════════════ -->
<nav id="bottom-nav" class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-[480px] bg-surface-container-lowest border-t border-outline-variant z-50" style="padding-bottom:max(8px, env(safe-area-inset-bottom))">
  <div class="flex justify-around items-center">
    <button data-tab="home" onclick="switchTab('home')" class="bnav-btn flex flex-col items-center gap-1 py-2 px-4 min-w-[64px]">
      <span class="material-symbols-outlined bnav-icon" style="font-size:22px">storefront</span>
      <span class="bnav-label text-[10px] font-bold">الرئيسية</span>
    </button>
    <button data-tab="orders" onclick="switchTab('orders')" class="bnav-btn flex flex-col items-center gap-1 py-2 px-4 min-w-[64px] relative">
      <span class="material-symbols-outlined bnav-icon" style="font-size:22px">receipt_long</span>
      <span class="bnav-label text-[10px] font-bold">طلباتك</span>
    </button>
    <button data-tab="wallet" onclick="switchTab('wallet')" class="bnav-btn flex flex-col items-center gap-1 py-2 px-4 min-w-[64px]">
      <span class="material-symbols-outlined bnav-icon" style="font-size:22px">account_balance_wallet</span>
      <span class="bnav-label text-[10px] font-bold">المحفظة</span>
    </button>
    <button data-tab="account" onclick="switchTab('account')" class="bnav-btn flex flex-col items-center gap-1 py-2 px-4 min-w-[64px]">
      <span class="material-symbols-outlined bnav-icon" style="font-size:22px">person</span>
      <span class="bnav-label text-[10px] font-bold">حسابك</span>
    </button>
  </div>
</nav>
<style>
  .bnav-btn .bnav-icon, .bnav-btn .bnav-label { color: #9aa39a; }
  .bnav-btn.active .bnav-icon, .bnav-btn.active .bnav-label { color: #0d631b; }
  .bnav-btn.active .bnav-icon { font-variation-settings: 'FILL' 1; }
</style>

<!-- ══════════════════════════════════════════
     ERROR STATE
══════════════════════════════════════════ -->
<div id="home-error" class="max-w-[480px] mx-auto min-h-screen bg-background hidden flex flex-col items-center justify-center px-8 text-center">
  <span class="material-symbols-outlined text-outline mb-3" style="font-size:52px">wifi_off</span>
  <h2 class="text-base font-extrabold text-on-surface mb-1">حدثت مشكلة في الاتصال</h2>
  <p class="text-xs text-outline mb-5">تأكد من الإنترنت وحاول تاني</p>
  <button onclick="location.reload()" class="bg-primary text-on-primary text-sm font-bold rounded-full px-7 py-3 flex items-center gap-2">
    <span class="material-symbols-outlined" style="font-size:18px">refresh</span> حاول مرة أخرى
  </button>
</div>

<script src="home.js"></script>
</body>
</html>
