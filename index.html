<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>المنيو</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet" />

  <style>
    * { font-family: 'Tajawal', sans-serif; }

    /* ── Dynamic theme vars injected by JS ── */
    :root {
      --brand-primary:   #FF6B00;
      --brand-secondary: #1A1A1A;
    }

    .brand-bg   { background-color: var(--brand-primary); }
    .brand-text { color: var(--brand-primary); }
    .brand-border { border-color: var(--brand-primary); }

    /* ── Cart button pulse ── */
    @keyframes cart-pop {
      0%   { transform: scale(1); }
      40%  { transform: scale(1.15); }
      100% { transform: scale(1); }
    }
    .cart-pop { animation: cart-pop 0.25s ease-out; }

    /* ── Skeleton shimmer ── */
    @keyframes shimmer {
      0%   { background-position: -600px 0; }
      100% { background-position:  600px 0; }
    }
    .skeleton {
      background: linear-gradient(90deg, #e8e8e8 25%, #f5f5f5 50%, #e8e8e8 75%);
      background-size: 600px 100%;
      animation: shimmer 1.4s infinite linear;
      border-radius: 8px;
    }

    /* ── Sticky category tabs shadow ── */
    .tabs-shadow { box-shadow: 0 2px 12px rgba(0,0,0,0.08); }

    /* ── Card hover ── */
    .product-card {
      transition: transform 0.18s ease, box-shadow 0.18s ease;
    }
    .product-card:active {
      transform: scale(0.97);
    }

    /* ── Scrollbar hide for category tabs ── */
    .tabs-scroll::-webkit-scrollbar { display: none; }
    .tabs-scroll { -ms-overflow-style: none; scrollbar-width: none; }

    /* ── Fade-in for content ── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .fade-up { animation: fadeUp 0.35s ease-out both; }
  </style>
</head>

<body class="bg-gray-50 min-h-screen">

  <!-- ══════════════════════════════════════
       STATES: Loading / Error / App
  ══════════════════════════════════════ -->

  <!-- Loading State -->
  <div id="state-loading" class="p-4 max-w-lg mx-auto">
    <!-- Header skeleton -->
    <div class="skeleton h-40 w-full mb-4"></div>
    <!-- Tabs skeleton -->
    <div class="flex gap-2 mb-6">
      <div class="skeleton h-8 w-20"></div>
      <div class="skeleton h-8 w-24"></div>
      <div class="skeleton h-8 w-16"></div>
    </div>
    <!-- Cards skeleton -->
    <div class="space-y-4">
      <div class="skeleton h-28 w-full"></div>
      <div class="skeleton h-28 w-full"></div>
      <div class="skeleton h-28 w-full"></div>
      <div class="skeleton h-28 w-full"></div>
    </div>
  </div>

  <!-- Error State -->
  <div id="state-error" class="hidden flex flex-col items-center justify-center min-h-screen p-8 text-center">
    <div class="text-6xl mb-4">🍽️</div>
    <h2 class="text-xl font-bold text-gray-800 mb-2">لم نجد هذا المطعم</h2>
    <p id="error-msg" class="text-gray-500 text-sm">تحقق من الرابط وحاول مجدداً</p>
  </div>

  <!-- App Shell (hidden until data loads) -->
  <div id="state-app" class="hidden max-w-lg mx-auto pb-36">

    <!-- زر الرجوع للداشبورد — يظهر فقط لو جاي من المعاينة -->
    <div id="back-to-dash" class="hidden bg-gray-800 text-white text-xs font-bold
                                  px-4 py-2 flex items-center justify-between">
      <span>أنت في وضع المعاينة</span>
      <a href="./dashboard.html"
         class="bg-white text-gray-800 px-3 py-1 rounded-lg font-bold">
        ← الرجوع للوحة التحكم
      </a>
    </div>

    <!-- ── Header ── -->
    <header id="restaurant-header" class="relative brand-bg text-white">
      <div class="p-6 pt-10 pb-8">
        <div class="flex items-center gap-4">
          <img id="restaurant-logo"
               src="" alt="لوجو"
               class="w-16 h-16 rounded-2xl object-cover bg-white/20 hidden" />
          <div>
            <p class="text-white/70 text-sm font-medium">أهلاً بك في</p>
            <h1 id="restaurant-name" class="text-2xl font-extrabold leading-tight"></h1>
          </div>
        </div>
      </div>
      <!-- Wave divider -->
      <svg class="w-full -mb-px block" viewBox="0 0 390 24" preserveAspectRatio="none">
        <path d="M0,0 C130,24 260,24 390,0 L390,24 L0,24 Z" fill="#f9fafb"/>
      </svg>
    </header>

    <!-- ── Category Tabs (sticky) ── -->
    <div class="sticky top-0 z-20 bg-gray-50 tabs-shadow">
      <div id="category-tabs"
           class="tabs-scroll flex gap-2 overflow-x-auto px-4 py-3">
        <!-- injected by JS -->
      </div>
    </div>

    <!-- ── Products ── -->
    <main id="products-container" class="px-4 pt-4 space-y-8">
      <!-- injected by JS -->
    </main>

  </div>

  <!-- ══════════════════════════════════════
       CART — Floating Bar
  ══════════════════════════════════════ -->
  <div id="cart-bar"
       class="hidden fixed bottom-0 left-0 right-0 z-30 max-w-lg mx-auto p-4">
    <button onclick="openCartSheet()"
            class="brand-bg w-full text-white font-bold rounded-2xl p-4
                   flex items-center justify-between shadow-2xl
                   active:opacity-90 transition-opacity">
      <span id="cart-count-badge"
            class="bg-white/20 text-sm px-3 py-1 rounded-full font-bold">
        0 منتج
      </span>
      <span>عرض السلة 🛒</span>
      <span id="cart-total-badge" class="text-sm font-bold">0.00</span>
    </button>
  </div>

  <!-- ══════════════════════════════════════
       CART SHEET — Bottom Sheet
  ══════════════════════════════════════ -->
  <div id="cart-sheet"
       class="hidden fixed inset-0 z-40 flex flex-col justify-end">

    <!-- Overlay -->
    <div class="absolute inset-0 bg-black/50 backdrop-blur-sm"
         onclick="closeCartSheet()"></div>

    <!-- Sheet -->
    <div class="relative bg-white rounded-t-3xl max-h-[85vh] flex flex-col shadow-2xl">
      <div class="flex items-center justify-between p-5 border-b border-gray-100">
        <h2 class="text-lg font-extrabold text-gray-800">سلة الطلبات</h2>
        <button onclick="closeCartSheet()"
                class="text-gray-400 hover:text-gray-600 text-2xl leading-none">&times;</button>
      </div>

      <!-- Cart Items -->
      <div id="cart-items-list" class="flex-1 overflow-y-auto p-4 space-y-3">
        <!-- injected by JS -->
      </div>

      <!-- Table Input + Send -->
      <div class="p-4 border-t border-gray-100 space-y-3">
        <input id="table-number-input"
               type="text"
               placeholder="رقم الطاولة (اختياري)"
               class="w-full border border-gray-200 rounded-xl px-4 py-3
                      text-sm text-gray-700 focus:outline-none focus:ring-2
                      focus:ring-offset-1 brand-border" />

        <div class="flex items-center justify-between text-sm font-bold text-gray-600 px-1">
          <span>الإجمالي</span>
          <span id="cart-grand-total" class="text-lg brand-text">0.00 ر.س</span>
        </div>

        <button id="send-order-btn"
                onclick="sendOrder()"
                class="brand-bg w-full text-white font-extrabold rounded-2xl p-4
                       active:opacity-80 transition-opacity disabled:opacity-50
                       flex items-center justify-center gap-2">
          <span>إرسال الطلب عبر واتساب</span>
          <span class="text-xl">📲</span>
        </button>
      </div>
    </div>
  </div>


  <!-- ══════════════════════════════════════
       JAVASCRIPT
  ══════════════════════════════════════ -->
  <script>
  // ─────────────────────────────────────────
  // 0. CONFIG — ضع مفاتيحك هنا
  // ─────────────────────────────────────────
  const SUPABASE_URL  = 'https://pcmyugeqveyjnappulng.supabase.co'
  const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBjbXl1Z2VxdmV5am5hcHB1bG5nIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODExNjU0NDAsImV4cCI6MjA5Njc0MTQ0MH0.uwn0X4CvNRW38FGh_0rYD9KjBRM19CydXucfBsCDYeo'

  const { createClient } = supabase
  const db = createClient(SUPABASE_URL, SUPABASE_ANON)

  // ─────────────────────────────────────────
  // 1. STATE — كل حالة التطبيق في مكان واحد
  // ─────────────────────────────────────────
  const state = {
    restaurant: null,
    categories: [],
    products:   [],
    cart:       [],            // [{ product, qty }]
    activeCategory: null
  }

  // ─────────────────────────────────────────
  // 2. BOOT — نقطة الدخول الوحيدة
  // ─────────────────────────────────────────
  async function boot() {
    const slug = new URLSearchParams(location.search).get('r')

    if (!slug) {
      return showError('لم يتم تحديد المطعم في الرابط. مثال: menu.html?r=burger-house')
    }

    try {
      await loadRestaurantData(slug)
      applyTheme()
      renderHeader()
      renderCategoryTabs()
      renderProducts()
      showState('app')
    } catch (err) {
      showError(err.message)
    }
  }

  // ─────────────────────────────────────────
  // 3. DATA — جلب كل البيانات في طلبين متوازيين
  // ─────────────────────────────────────────
  async function loadRestaurantData(slug) {
    // طلب 1: بيانات المطعم
    const { data: restaurant, error: rErr } = await db
      .from('restaurants')
      .select('id, name, logo_url, whatsapp, theme, slug')
      .eq('slug', slug)
      .eq('is_active', true)
      .single()

    if (rErr || !restaurant) throw new Error('المطعم غير موجود أو غير نشط')

    state.restaurant = restaurant

    // طلبان متوازيان: التصنيفات + المنتجات
    const [catRes, prodRes] = await Promise.all([
      db.from('categories')
        .select('id, name, sort_order')
        .eq('restaurant_id', restaurant.id)
        .order('sort_order'),

      db.from('products')
        .select('id, category_id, name, description, price, image_url, sort_order')
        .eq('restaurant_id', restaurant.id)
        .eq('is_available', true)
        .order('sort_order')
    ])

    if (catRes.error)  throw new Error('فشل تحميل التصنيفات')
    if (prodRes.error) throw new Error('فشل تحميل المنتجات')

    state.categories   = catRes.data
    state.products     = prodRes.data
    state.activeCategory = catRes.data[0]?.id ?? null
  }

  // ─────────────────────────────────────────
  // 4. THEME — تطبيق ألوان المطعم ديناميكياً
  // ─────────────────────────────────────────
  function applyTheme() {
    const theme = state.restaurant.theme ?? {}
    const root  = document.documentElement.style
    if (theme.primary)   root.setProperty('--brand-primary',   theme.primary)
    if (theme.secondary) root.setProperty('--brand-secondary', theme.secondary)
  }

  // ─────────────────────────────────────────
  // 5. RENDER FUNCTIONS
  // ─────────────────────────────────────────

  function renderHeader() {
    const r = state.restaurant
    document.title = r.name

    const nameEl = document.getElementById('restaurant-name')
    const logoEl = document.getElementById('restaurant-logo')

    nameEl.textContent = r.name

    if (r.logo_url) {
      logoEl.src = r.logo_url
      logoEl.classList.remove('hidden')
    }
  }

  function renderCategoryTabs() {
    const container = document.getElementById('category-tabs')
    container.innerHTML = state.categories.map(cat => `
      <button
        data-cat="${cat.id}"
        onclick="filterByCategory('${cat.id}')"
        class="category-tab flex-shrink-0 px-4 py-1.5 rounded-full text-sm font-bold
               transition-all duration-200 border-2
               ${cat.id === state.activeCategory
                 ? 'brand-bg text-white border-transparent'
                 : 'bg-white text-gray-600 border-gray-200'}"
      >${cat.name}</button>
    `).join('')
  }

  function renderProducts() {
    const container = document.getElementById('products-container')

    const sections = state.categories.map(cat => {
      const items = state.products.filter(p => p.category_id === cat.id)
      if (!items.length) return ''

      return `
        <section id="cat-${cat.id}" class="fade-up">
          <h2 class="text-base font-extrabold text-gray-800 mb-3 px-1">${cat.name}</h2>
          <div class="space-y-3">
            ${items.map(p => productCard(p)).join('')}
          </div>
        </section>
      `
    }).join('')

    // منتجات بدون تصنيف
    const uncategorized = state.products.filter(p => !p.category_id)
    const uncatSection = uncategorized.length ? `
      <section class="fade-up">
        <h2 class="text-base font-extrabold text-gray-800 mb-3 px-1">منتجات أخرى</h2>
        <div class="space-y-3">
          ${uncategorized.map(p => productCard(p)).join('')}
        </div>
      </section>` : ''

    container.innerHTML = sections + uncatSection
  }

  function productCard(p) {
    return `
      <div class="product-card bg-white rounded-2xl shadow-sm overflow-hidden
                  flex items-stretch border border-gray-100">
        ${p.image_url ? `
          <img src="${p.image_url}" alt="${p.name}"
               class="w-28 h-28 object-cover flex-shrink-0"
               loading="lazy" />
        ` : `
          <div class="w-28 h-28 bg-gray-100 flex items-center justify-center
                      text-3xl flex-shrink-0">🍽️</div>
        `}
        <div class="flex-1 p-3 flex flex-col justify-between">
          <div>
            <h3 class="font-bold text-gray-800 text-sm leading-snug">${p.name}</h3>
            ${p.description ? `
              <p class="text-xs text-gray-400 mt-0.5 line-clamp-2">${p.description}</p>
            ` : ''}
          </div>
          <div class="flex items-center justify-between mt-2">
            <span class="brand-text font-extrabold text-sm">
              ${Number(p.price).toFixed(2)} ر.س
            </span>
            <button
              onclick="addToCart('${p.id}')"
              class="brand-bg text-white w-8 h-8 rounded-xl font-bold text-lg
                     flex items-center justify-center leading-none
                     active:opacity-70 transition-opacity"
              aria-label="أضف ${p.name}">+</button>
          </div>
        </div>
      </div>
    `
  }

  // ─────────────────────────────────────────
  // 6. CATEGORY FILTER — scroll + highlight
  // ─────────────────────────────────────────
  function filterByCategory(catId) {
    state.activeCategory = catId

    // تحديث الـ tabs
    document.querySelectorAll('.category-tab').forEach(btn => {
      const isActive = btn.dataset.cat === catId
      btn.className = btn.className
        .replace(/brand-bg text-white border-transparent|bg-white text-gray-600 border-gray-200/g, '')
        .trim()
      btn.classList.add(
        ...(isActive
          ? ['brand-bg','text-white','border-transparent']
          : ['bg-white','text-gray-600','border-gray-200'])
      )
    })

    // Scroll للسكشن
    const section = document.getElementById(`cat-${catId}`)
    if (section) {
      const offset = 72 // ارتفاع الـ sticky tabs تقريباً
      const top = section.getBoundingClientRect().top + window.scrollY - offset
      window.scrollTo({ top, behavior: 'smooth' })
    }
  }

  // ─────────────────────────────────────────
  // 7. CART LOGIC
  // ─────────────────────────────────────────
  function addToCart(productId) {
    const product = state.products.find(p => p.id === productId)
    if (!product) return

    const existing = state.cart.find(c => c.product.id === productId)
    if (existing) {
      existing.qty += 1
    } else {
      state.cart.push({ product, qty: 1 })
    }

    updateCartUI()

    // Animation على الزر
    const btn = document.querySelector(`button[onclick="addToCart('${productId}')"]`)
    if (btn) {
      btn.classList.add('cart-pop')
      setTimeout(() => btn.classList.remove('cart-pop'), 300)
    }
  }

  function changeQty(productId, delta) {
    const idx = state.cart.findIndex(c => c.product.id === productId)
    if (idx === -1) return

    state.cart[idx].qty += delta

    if (state.cart[idx].qty <= 0) {
      state.cart.splice(idx, 1)
    }

    updateCartUI()
    renderCartItems()
  }

  function updateCartUI() {
    const totalItems = state.cart.reduce((s, c) => s + c.qty, 0)
    const totalPrice = cartTotal()

    const cartBar = document.getElementById('cart-bar')
    const countBadge = document.getElementById('cart-count-badge')
    const totalBadge = document.getElementById('cart-total-badge')

    countBadge.textContent = `${totalItems} ${totalItems === 1 ? 'منتج' : 'منتجات'}`
    totalBadge.textContent = `${totalPrice.toFixed(2)} ر.س`

    if (totalItems > 0) {
      cartBar.classList.remove('hidden')
    } else {
      cartBar.classList.add('hidden')
      closeCartSheet()
    }
  }

  function cartTotal() {
    return state.cart.reduce((s, c) => s + (c.product.price * c.qty), 0)
  }

  // ─────────────────────────────────────────
  // 8. CART SHEET
  // ─────────────────────────────────────────
  function openCartSheet() {
    renderCartItems()
    document.getElementById('cart-sheet').classList.remove('hidden')
    document.body.style.overflow = 'hidden'
  }

  function closeCartSheet() {
    document.getElementById('cart-sheet').classList.add('hidden')
    document.body.style.overflow = ''
  }

  function renderCartItems() {
    const container = document.getElementById('cart-items-list')
    const grandTotal = document.getElementById('cart-grand-total')

    if (!state.cart.length) {
      container.innerHTML = `
        <div class="text-center py-8 text-gray-400">
          <div class="text-4xl mb-2">🛒</div>
          <p class="text-sm">السلة فارغة</p>
        </div>`
      grandTotal.textContent = '0.00 ر.س'
      return
    }

    container.innerHTML = state.cart.map(c => `
      <div class="flex items-center gap-3 bg-gray-50 rounded-xl p-3">
        <div class="flex-1">
          <p class="font-bold text-gray-800 text-sm">${c.product.name}</p>
          <p class="brand-text text-xs font-bold mt-0.5">
            ${(c.product.price * c.qty).toFixed(2)} ر.س
          </p>
        </div>
        <div class="flex items-center gap-2">
          <button onclick="changeQty('${c.product.id}', -1)"
                  class="w-7 h-7 rounded-lg bg-gray-200 text-gray-700 font-bold
                         flex items-center justify-center text-base leading-none">−</button>
          <span class="w-5 text-center font-bold text-sm text-gray-800">${c.qty}</span>
          <button onclick="changeQty('${c.product.id}', 1)"
                  class="brand-bg w-7 h-7 rounded-lg text-white font-bold
                         flex items-center justify-center text-base leading-none">+</button>
        </div>
      </div>
    `).join('')

    grandTotal.textContent = `${cartTotal().toFixed(2)} ر.س`
  }

  // ─────────────────────────────────────────
  // 9. SEND ORDER — Backend أولاً، واتساب ثانياً
  // ─────────────────────────────────────────
  async function sendOrder() {
    if (!state.cart.length) return

    const btn = document.getElementById('send-order-btn')
    btn.disabled = true
    btn.innerHTML = '<span class="opacity-70">جاري الإرسال...</span>'

    const tableNumber = document.getElementById('table-number-input').value.trim()

    // بناء snapshot الطلب
    const items = state.cart.map(c => ({
      id:    c.product.id,
      name:  c.product.name,
      price: Number(c.product.price),
      qty:   c.qty,
      subtotal: Number((c.product.price * c.qty).toFixed(2))
    }))

    const total = cartTotal()

    // إنشاء رقم الطلب في الـ Backend
    const { data: orderData, error } = await db.rpc('generate_order_number')
      .then(async (res) => {
        if (res.error) throw res.error

        // حفظ الطلب في قاعدة البيانات
        return await db.from('orders').insert({
          restaurant_id: state.restaurant.id,
          order_number:  res.data,
          items,
          total,
          table_number: tableNumber || null
        }).select('order_number').single()
      })

    if (error || !orderData) {
      // لو فشل الحفظ، لا نوقف العميل — نرسل بدون رقم طلب
      console.warn('Order save failed, continuing without ID')
    }

    const orderNumber = orderData?.order_number ?? 'TMP-' + Date.now()

    // بناء رسالة الواتساب
    const now = new Date().toLocaleTimeString('ar-SA', { hour: '2-digit', minute: '2-digit' })

    const lines = [
      `🧾 *طلب جديد ${orderNumber}*`,
      `─────────────────`,
      ...items.map(i => `${i.name} × ${i.qty} — ${i.subtotal.toFixed(2)} ر.س`),
      `─────────────────`,
      `💰 *الإجمالي: ${total.toFixed(2)} ر.س*`,
      tableNumber ? `📍 الطاولة: ${tableNumber}` : '',
      `⏰ ${now}`
    ].filter(Boolean).join('\n')

    const waUrl = `https://wa.me/${state.restaurant.whatsapp}?text=${encodeURIComponent(lines)}`

    // فتح واتساب
    window.open(waUrl, '_blank')

    // تفريغ السلة
    state.cart = []
    updateCartUI()
    closeCartSheet()

    // إعادة الزر
    btn.disabled = false
    btn.innerHTML = '<span>إرسال الطلب عبر واتساب</span><span class="text-xl">📲</span>'
  }

  // ─────────────────────────────────────────
  // 10. HELPERS
  // ─────────────────────────────────────────
  function showState(name) {
    document.getElementById('state-loading').classList.add('hidden')
    document.getElementById('state-error').classList.add('hidden')
    document.getElementById('state-app').classList.add('hidden')
    document.getElementById(`state-${name}`).classList.remove('hidden')
  }

  function showError(msg) {
    document.getElementById('error-msg').textContent = msg
    showState('error')
  }

  // ─────────────────────────────────────────
  // START
  // ─────────────────────────────────────────
  // إظهار زر الرجوع لو جاي من المعاينة
  if (document.referrer.includes('dashboard')) {
    document.getElementById('back-to-dash').classList.remove('hidden')
  }
  boot()
  </script>
</body>
</html>
