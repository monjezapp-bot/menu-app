<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>المنيو</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet" />

  <style>
    * { font-family: 'Tajawal', sans-serif; }

    :root {
      --brand-primary:   #FF6B00;
      --brand-secondary: #1A1A1A;
    }

    .brand-bg     { background-color: var(--brand-primary); }
    .brand-text   { color: var(--brand-primary); }
    .brand-border { border-color: var(--brand-primary); }

    /* ── Cart pulse ── */
    @keyframes cart-pop {
      0%   { transform: scale(1); }
      40%  { transform: scale(1.18); }
      100% { transform: scale(1); }
    }
    .cart-pop { animation: cart-pop 0.25s ease-out; }

    /* ── Skeleton shimmer ── */
    @keyframes shimmer {
      0%   { background-position: -600px 0; }
      100% { background-position:  600px 0; }
    }
    .skeleton {
      background: linear-gradient(90deg, #e8e8e8 25%, #f5f5f5 50%, #e8e8e8 75%);
      background-size: 600px 100%;
      animation: shimmer 1.4s infinite linear;
      border-radius: 10px;
    }

    /* ── Fade up ── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .fade-up { animation: fadeUp 0.35s ease-out both; }

    /* ── Scrollbar hide ── */
    .tabs-scroll::-webkit-scrollbar { display: none; }
    .tabs-scroll { -ms-overflow-style: none; scrollbar-width: none; }

    /* ── Sticky tabs shadow ── */
    .tabs-shadow { box-shadow: 0 2px 12px rgba(0,0,0,0.08); }

    /* ── Hero header ── */
    .hero-header {
      min-height: 180px;
      background: linear-gradient(135deg, var(--brand-secondary) 0%, var(--brand-primary) 100%);
      position: relative;
      overflow: hidden;
    }
    .hero-header::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 30% 50%, rgba(255,255,255,0.08) 0%, transparent 60%);
    }
    .hero-content {
      position: relative;
      z-index: 1;
      padding: 32px 20px 24px;
    }

    /* ── Search bar ── */
    .search-wrap { position: relative; }
    .search-wrap input {
      width: 100%;
      background: #fff;
      border: 1.5px solid #eee;
      border-radius: 14px;
      padding: 11px 44px 11px 16px;
      font-size: 14px;
      color: #333;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      font-family: 'Tajawal', sans-serif;
    }
    .search-wrap input:focus {
      border-color: var(--brand-primary);
      box-shadow: 0 0 0 3px rgba(255,107,0,0.1);
    }
    .search-wrap .search-icon {
      position: absolute;
      right: 14px; top: 50%;
      transform: translateY(-50%);
      color: #bbb;
      pointer-events: none;
    }

    /* ── Product card ── */
    .product-card {
      transition: transform 0.18s ease, box-shadow 0.18s ease;
      border-radius: 16px;
      overflow: hidden;
    }
    .product-card:active { transform: scale(0.97); }

    /* ── Modal ── */
    @keyframes sheetUp {
      from { transform: translateY(60px); opacity: 0; }
      to   { transform: translateY(0);    opacity: 1; }
    }
    .sheet-up { animation: sheetUp 0.28s ease both; }

    /* ── No results ── */
    .no-results {
      text-align: center;
      padding: 60px 20px;
    }

    /* ── Cart sheet animation ── */
    @keyframes slideUp {
      from { transform: translateY(100%); }
      to   { transform: translateY(0); }
    }
    .slide-up { animation: slideUp 0.3s cubic-bezier(0.34,1.2,0.64,1) both; }
  </style>
</head>

<body class="bg-gray-50 min-h-screen">

  <!-- ══════════ LOADING ══════════ -->
  <div id="state-loading" class="max-w-lg mx-auto">
    <div class="skeleton rounded-none" style="height:180px"></div>
    <div class="p-4 space-y-4">
      <div class="skeleton h-11 w-full"></div>
      <div class="flex gap-2">
        <div class="skeleton h-9 w-20"></div>
        <div class="skeleton h-9 w-28"></div>
        <div class="skeleton h-9 w-16"></div>
      </div>
      <div class="skeleton h-28 w-full"></div>
      <div class="skeleton h-28 w-full"></div>
      <div class="skeleton h-28 w-full"></div>
    </div>
  </div>

  <!-- ══════════ ERROR ══════════ -->
  <div id="state-error" class="hidden flex flex-col items-center justify-center min-h-screen p-8 text-center">
    <div class="text-6xl mb-4">🍽️</div>
    <h2 class="text-xl font-bold text-gray-800 mb-2">لم نجد هذا المطعم</h2>
    <p id="error-msg" class="text-gray-500 text-sm">تحقق من الرابط وحاول مجدداً</p>
  </div>

  <!-- ══════════ APP ══════════ -->
  <div id="state-app" class="hidden max-w-lg mx-auto pb-36">

    <!-- Preview bar -->
    <div id="back-to-dash" class="hidden bg-gray-900 text-white text-xs font-bold px-4 py-2 flex items-center justify-between">
      <span>🔍 أنت في وضع المعاينة</span>
      <a href="./dashboard.html" class="bg-white text-gray-900 px-3 py-1 rounded-lg font-bold">← لوحة التحكم</a>
    </div>

    <!-- ── HERO HEADER ── -->
    <header class="hero-header">
      <div class="hero-content">
        <div class="flex items-center gap-4">
          <img id="restaurant-logo" src="" alt="لوجو"
               class="w-16 h-16 rounded-2xl object-cover border-2 border-white/30 shadow-lg hidden" />
          <div>
            <p class="text-white/60 text-xs font-semibold mb-1">أهلاً بك في</p>
            <h1 id="restaurant-name" class="text-2xl font-black text-white leading-tight"></h1>
          </div>
        </div>
      </div>
      <svg class="w-full block" style="margin-bottom:-1px" viewBox="0 0 390 28" preserveAspectRatio="none">
        <path d="M0,0 C130,28 260,28 390,0 L390,28 L0,28 Z" fill="#f9fafb"/>
      </svg>
    </header>

    <!-- ── SEARCH ── -->
    <div class="px-4 pt-4 pb-1">
      <div class="search-wrap">
        <input type="search" id="search-input" placeholder="ابحث عن أكلة..." oninput="handleSearch()" autocomplete="off" />
        <span class="search-icon">
          <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
            <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
          </svg>
        </span>
      </div>
    </div>

    <!-- ── CATEGORY TABS ── -->
    <div class="sticky top-0 z-20 bg-gray-50 tabs-shadow">
      <div id="category-tabs" class="tabs-scroll flex gap-2 overflow-x-auto px-4 py-3">
        <!-- injected by JS -->
      </div>
    </div>

    <!-- ── PRODUCTS ── -->
    <main id="products-container" class="px-4 pt-4 space-y-8">
      <!-- injected by JS -->
    </main>

    <!-- ── NO RESULTS ── -->
    <div id="no-results" class="no-results hidden">
      <div class="text-5xl mb-3">🔍</div>
      <p class="font-bold text-gray-500 text-base">لا توجد نتائج</p>
      <p class="text-sm text-gray-400 mt-1">جرب كلمة بحث مختلفة</p>
    </div>

  </div>

  <!-- ══════════ CART BAR ══════════ -->
  <div id="cart-bar" class="hidden fixed bottom-0 left-0 right-0 z-30 max-w-lg mx-auto p-4">
    <button onclick="openCartSheet()"
            class="brand-bg w-full text-white font-bold rounded-2xl p-4
                   flex items-center justify-between shadow-2xl active:opacity-90 transition-opacity">
      <span id="cart-count-badge" class="bg-white/20 text-sm px-3 py-1 rounded-full font-bold">0 منتج</span>
      <span class="font-extrabold">عرض السلة 🛒</span>
      <span id="cart-total-badge" class="text-sm font-bold">0 ج.م</span>
    </button>
  </div>

  <!-- ══════════ CART SHEET ══════════ -->
  <div id="cart-sheet" class="hidden fixed inset-0 z-40 flex flex-col justify-end">
    <div class="absolute inset-0 bg-black/50 backdrop-blur-sm" onclick="closeCartSheet()"></div>
    <div class="slide-up relative bg-white rounded-t-3xl max-h-[88vh] flex flex-col shadow-2xl">

      <div class="flex items-center justify-between px-5 pt-5 pb-4 border-b border-gray-100">
        <div>
          <h2 class="text-lg font-extrabold text-gray-800">سلة الطلبات</h2>
          <p id="cart-items-count" class="text-xs text-gray-400 mt-0.5"></p>
        </div>
        <button onclick="closeCartSheet()"
                class="w-9 h-9 rounded-full bg-gray-100 text-gray-500 flex items-center justify-center text-xl font-bold">&times;</button>
      </div>

      <div id="cart-items-list" class="flex-1 overflow-y-auto p-4 space-y-3"></div>

      <div class="p-4 border-t border-gray-100 space-y-3">
        <input id="table-number-input" type="text" placeholder="رقم الطاولة (اختياري)"
               class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm text-gray-700
                      focus:outline-none focus:border-[var(--brand-primary)] transition-colors"
               style="font-family:'Tajawal',sans-serif" />
        <div class="flex items-center justify-between px-1">
          <span class="text-sm font-bold text-gray-500">الإجمالي</span>
          <span id="cart-grand-total" class="text-xl font-black brand-text">0 ج.م</span>
        </div>
        <button id="send-order-btn" onclick="sendOrder()"
                class="brand-bg w-full text-white font-extrabold rounded-2xl p-4
                       active:opacity-80 transition-opacity disabled:opacity-50
                       flex items-center justify-center gap-2">
          <span>إرسال الطلب عبر واتساب</span>
          <span class="text-xl">📲</span>
        </button>
      </div>
    </div>
  </div>

  <!-- ══════════ PRODUCT MODAL ══════════ -->
  <div id="product-modal" class="hidden fixed inset-0 z-50 flex items-end justify-center">
    <div class="absolute inset-0 bg-black/60 backdrop-blur-sm" onclick="closeModal()"></div>
    <div id="modal-content"
         class="sheet-up relative bg-white w-full max-w-lg rounded-t-3xl max-h-[90vh] overflow-y-auto shadow-2xl">
      <!-- injected by JS -->
    </div>
  </div>

  <!-- ══════════ JAVASCRIPT ══════════ -->
  <script>
  // ─────────────────────────────────
  // 0. CONFIG
  // ─────────────────────────────────
  const SUPABASE_URL  = 'https://pcmyugeqveyjnappulng.supabase.co'
  const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBjbXl1Z2VxdmV5am5hcHB1bG5nIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODExNjU0NDAsImV4cCI6MjA5Njc0MTQ0MH0.uwn0X4CvNRW38FGh_0rYD9KjBRM19CydXucfBsCDYeo'

  const { createClient } = supabase
  const db = createClient(SUPABASE_URL, SUPABASE_ANON)

  // ─────────────────────────────────
  // 1. STATE
  // ─────────────────────────────────
  const state = {
    restaurant:     null,
    categories:     [],
    products:       [],
    cart:           [],
    activeCategory: null,
    searchQuery:    ''
  }

  // ─────────────────────────────────
  // 2. BOOT
  // ─────────────────────────────────
  async function boot() {
    const slug = new URLSearchParams(location.search).get('r')
    if (!slug) return showError('لم يتم تحديد المطعم. مثال: ?r=my-restaurant')

    try {
      await loadRestaurantData(slug)
      applyTheme()
      renderHeader()
      renderCategoryTabs()
      renderProducts()
      showState('app')
    } catch (err) {
      showError(err.message)
    }
  }

  // ─────────────────────────────────
  // 3. DATA
  // ─────────────────────────────────
  async function loadRestaurantData(slug) {
    const { data: restaurant, error: rErr } = await db
      .from('restaurants')
      .select('id, name, logo_url, whatsapp, theme, slug')
      .eq('slug', slug)
      .eq('is_active', true)
      .single()

    if (rErr || !restaurant) throw new Error('المطعم غير موجود أو غير نشط')
    state.restaurant = restaurant

    const [catRes, prodRes] = await Promise.all([
      db.from('categories')
        .select('id, name, sort_order')
        .eq('restaurant_id', restaurant.id)
        .order('sort_order'),

      db.from('products')
        .select('id, category_id, name, description, price, image_url, sort_order')
        .eq('restaurant_id', restaurant.id)
        .eq('is_available', true)
        .order('sort_order')
    ])

    if (catRes.error)  throw new Error('فشل تحميل التصنيفات')
    if (prodRes.error) throw new Error('فشل تحميل المنتجات')

    state.categories    = catRes.data
    state.products      = prodRes.data
    state.activeCategory = catRes.data[0]?.id ?? null
  }

  // ─────────────────────────────────
  // 4. THEME
  // ─────────────────────────────────
  function applyTheme() {
    const theme = state.restaurant.theme ?? {}
    const root  = document.documentElement.style
    if (theme.primary)   root.setProperty('--brand-primary',   theme.primary)
    if (theme.secondary) root.setProperty('--brand-secondary', theme.secondary)
  }

  // ─────────────────────────────────
  // 5. RENDER HEADER
  // ─────────────────────────────────
  function renderHeader() {
    const r = state.restaurant
    document.title = r.name
    document.getElementById('restaurant-name').textContent = r.name

    if (r.logo_url) {
      const logo = document.getElementById('restaurant-logo')
      logo.src = r.logo_url
      logo.classList.remove('hidden')
    }
  }

  // ─────────────────────────────────
  // 6. RENDER TABS
  // ─────────────────────────────────
  function renderCategoryTabs() {
    const container = document.getElementById('category-tabs')
    container.innerHTML = state.categories.map(cat => `
      <button
        data-cat="${cat.id}"
        onclick="filterByCategory('${cat.id}')"
        class="flex-shrink-0 px-4 py-1.5 rounded-full text-sm font-bold
               transition-all duration-200 border-2
               ${cat.id === state.activeCategory
                 ? 'brand-bg text-white border-transparent'
                 : 'bg-white text-gray-600 border-gray-200'}"
      >${cat.name}</button>
    `).join('')
  }

  function filterByCategory(catId) {
    state.activeCategory = catId
    state.searchQuery = ''
    document.getElementById('search-input').value = ''

    document.querySelectorAll('#category-tabs button').forEach(btn => {
      const active = btn.dataset.cat === catId
      btn.className = btn.className
        .replace(/brand-bg text-white border-transparent|bg-white text-gray-600 border-gray-200/g, '')
        .trim()
      btn.classList.add(...(active
        ? ['brand-bg','text-white','border-transparent']
        : ['bg-white','text-gray-600','border-gray-200']))
    })

    renderProducts()

    const section = document.getElementById(`cat-${catId}`)
    if (section) {
      const offset = 72
      const top = section.getBoundingClientRect().top + window.scrollY - offset
      window.scrollTo({ top, behavior: 'smooth' })
    }
  }

  // ─────────────────────────────────
  // 7. RENDER PRODUCTS
  // ─────────────────────────────────
  function renderProducts(filtered) {
    const container = document.getElementById('products-container')
    const noResults = document.getElementById('no-results')
    const products  = filtered !== undefined ? filtered : state.products

    if (filtered !== undefined && filtered.length === 0) {
      container.innerHTML = ''
      noResults.classList.remove('hidden')
      return
    }
    noResults.classList.add('hidden')

    const sections = state.categories.map(cat => {
      const items = products.filter(p => p.category_id === cat.id)
      if (!items.length) return ''
      return `
        <section id="cat-${cat.id}" class="fade-up">
          <h2 class="text-base font-extrabold text-gray-800 mb-3 px-1">${cat.name}</h2>
          <div class="space-y-3">${items.map(p => productCard(p)).join('')}</div>
        </section>`
    }).join('')

    const uncategorized = products.filter(p => !p.category_id)
    const uncatSection = uncategorized.length ? `
      <section class="fade-up">
        <h2 class="text-base font-extrabold text-gray-800 mb-3 px-1">منتجات أخرى</h2>
        <div class="space-y-3">${uncategorized.map(p => productCard(p)).join('')}</div>
      </section>` : ''

    container.innerHTML = sections + uncatSection
  }

  // ─────────────────────────────────
  // 8. PRODUCT CARD
  // ─────────────────────────────────
  function productCard(p) {
    const inCart = state.cart.find(c => c.product.id === p.id)
    return `
      <div class="product-card bg-white flex items-stretch border border-gray-100 shadow-sm"
           onclick="openModal('${p.id}')">
        <div class="flex-1 p-3 flex flex-col justify-between">
          <div>
            <h3 class="font-bold text-gray-800 text-sm leading-snug">${p.name}</h3>
            ${p.description ? `<p class="text-xs text-gray-400 mt-1 line-clamp-2">${p.description}</p>` : ''}
          </div>
          <div class="flex items-center justify-between mt-2">
            <span class="brand-text font-extrabold text-sm">${fmt(p.price)}</span>
            ${inCart
              ? `<div class="flex items-center gap-1.5" onclick="event.stopPropagation()">
                   <button onclick="changeQty('${p.id}',-1)"
                           class="w-8 h-8 rounded-xl bg-gray-100 text-gray-700 font-bold flex items-center justify-center text-base">−</button>
                   <span class="w-5 text-center font-bold text-sm">${inCart.qty}</span>
                   <button onclick="changeQty('${p.id}',1)"
                           class="brand-bg w-8 h-8 rounded-xl text-white font-bold flex items-center justify-center text-base">+</button>
                 </div>`
              : `<button onclick="event.stopPropagation(); addToCart('${p.id}')"
                         class="brand-bg text-white w-9 h-9 rounded-xl font-bold text-xl
                                flex items-center justify-center active:opacity-70 transition-opacity cart-pop-trigger">+</button>`
            }
          </div>
        </div>
        ${p.image_url
          ? `<img src="${p.image_url}" alt="${p.name}" class="w-28 object-cover flex-shrink-0" loading="lazy" />`
          : `<div class="w-28 bg-gray-100 flex items-center justify-center text-3xl flex-shrink-0">🍽️</div>`
        }
      </div>`
  }

  // ─────────────────────────────────
  // 9. SEARCH
  // ─────────────────────────────────
  function handleSearch() {
    const q = document.getElementById('search-input').value.trim().toLowerCase()
    state.searchQuery = q
    if (!q) { renderProducts(); return }
    const filtered = state.products.filter(p =>
      p.name.toLowerCase().includes(q) ||
      (p.description && p.description.toLowerCase().includes(q))
    )
    renderProducts(filtered)
  }

  // ─────────────────────────────────
  // 10. PRODUCT MODAL
  // ─────────────────────────────────
  function openModal(productId) {
    const p = state.products.find(pr => pr.id === productId)
    if (!p) return

    const inCart = state.cart.find(c => c.product.id === productId)
    const qty    = inCart ? inCart.qty : 1

    document.getElementById('modal-content').innerHTML = `
      <div class="relative">
        ${p.image_url
          ? `<img src="${p.image_url}" alt="${p.name}" class="w-full h-52 object-cover" />`
          : `<div class="w-full h-44 bg-gray-100 flex items-center justify-center text-6xl">🍽️</div>`
        }
        <button onclick="closeModal()"
                class="absolute top-3 left-3 w-9 h-9 rounded-full bg-black/40 backdrop-blur-sm
                       text-white flex items-center justify-center text-xl font-bold">&times;</button>
      </div>
      <div class="p-5">
        <div class="flex items-start justify-between gap-2 mb-2">
          <h2 class="text-lg font-extrabold text-gray-900 leading-tight">${p.name}</h2>
          <span class="brand-text font-extrabold text-lg whitespace-nowrap">${fmt(p.price)}</span>
        </div>
        ${p.description ? `<p class="text-sm text-gray-500 leading-relaxed mb-4">${p.description}</p>` : '<div class="mb-4"></div>'}
        <div class="flex items-center gap-3">
          <div class="flex items-center gap-2 bg-gray-100 rounded-2xl px-3 py-2">
            <button id="modal-minus"
                    onclick="modalChangeQty(-1)"
                    class="w-8 h-8 rounded-xl bg-white shadow text-gray-700 font-bold flex items-center justify-center text-lg">−</button>
            <span id="modal-qty" class="w-7 text-center font-extrabold text-base">${qty}</span>
            <button onclick="modalChangeQty(1)"
                    class="brand-bg w-8 h-8 rounded-xl text-white font-bold flex items-center justify-center text-lg">+</button>
          </div>
          <button onclick="addFromModal('${p.id}')"
                  class="brand-bg flex-1 text-white font-extrabold rounded-2xl py-3 px-4
                         active:opacity-80 transition-opacity text-sm flex items-center justify-between">
            <span>أضف للسلة</span>
            <span id="modal-price">${fmt(p.price * qty)}</span>
          </button>
        </div>
      </div>`

    // store ref
    document.getElementById('product-modal').dataset.pid   = productId
    document.getElementById('product-modal').dataset.price = p.price
    document.getElementById('product-modal').dataset.qty   = qty

    document.getElementById('product-modal').classList.remove('hidden')
    document.body.style.overflow = 'hidden'
  }

  function modalChangeQty(delta) {
    const modal = document.getElementById('product-modal')
    let qty   = parseInt(modal.dataset.qty) + delta
    if (qty < 1) qty = 1
    const price = parseFloat(modal.dataset.price)
    modal.dataset.qty = qty
    document.getElementById('modal-qty').textContent   = qty
    document.getElementById('modal-price').textContent = fmt(price * qty)
    document.getElementById('modal-minus').disabled = qty <= 1
  }

  function addFromModal(productId) {
    const modal = document.getElementById('product-modal')
    const qty   = parseInt(modal.dataset.qty)
    const p     = state.products.find(pr => pr.id === productId)
    if (!p) return

    const existing = state.cart.find(c => c.product.id === productId)
    if (existing) {
      existing.qty = qty
    } else {
      state.cart.push({ product: p, qty })
    }

    closeModal()
    updateCartUI()
    renderProducts()
  }

  function closeModal() {
    document.getElementById('product-modal').classList.add('hidden')
    document.body.style.overflow = ''
  }

  // ─────────────────────────────────
  // 11. CART LOGIC
  // ─────────────────────────────────
  function addToCart(productId) {
    const product = state.products.find(p => p.id === productId)
    if (!product) return

    const existing = state.cart.find(c => c.product.id === productId)
    if (existing) {
      existing.qty += 1
    } else {
      state.cart.push({ product, qty: 1 })
    }

    updateCartUI()
    renderProducts()
  }

  function changeQty(productId, delta) {
    const idx = state.cart.findIndex(c => c.product.id === productId)
    if (idx === -1) return
    state.cart[idx].qty += delta
    if (state.cart[idx].qty <= 0) state.cart.splice(idx, 1)
    updateCartUI()
    renderProducts()
    if (!document.getElementById('cart-sheet').classList.contains('hidden')) renderCartItems()
  }

  function cartTotal() {
    return state.cart.reduce((s, c) => s + (c.product.price * c.qty), 0)
  }

  function updateCartUI() {
    const totalItems = state.cart.reduce((s, c) => s + c.qty, 0)
    const bar = document.getElementById('cart-bar')
    document.getElementById('cart-count-badge').textContent =
      `${totalItems} ${totalItems === 1 ? 'منتج' : 'منتجات'}`
    document.getElementById('cart-total-badge').textContent = fmt(cartTotal())
    totalItems > 0 ? bar.classList.remove('hidden') : (bar.classList.add('hidden'), closeCartSheet())
  }

  // ─────────────────────────────────
  // 12. CART SHEET
  // ─────────────────────────────────
  function openCartSheet() {
    renderCartItems()
    document.getElementById('cart-sheet').classList.remove('hidden')
    document.body.style.overflow = 'hidden'
  }

  function closeCartSheet() {
    document.getElementById('cart-sheet').classList.add('hidden')
    document.body.style.overflow = ''
  }

  function renderCartItems() {
    const container  = document.getElementById('cart-items-list')
    const grandTotal = document.getElementById('cart-grand-total')
    const countEl    = document.getElementById('cart-items-count')
    const total      = cartTotal()
    const count      = state.cart.reduce((s,c) => s+c.qty, 0)

    countEl.textContent = `${count} ${count === 1 ? 'منتج' : 'منتجات'}`

    if (!state.cart.length) {
      container.innerHTML = `
        <div class="text-center py-10 text-gray-300">
          <div class="text-5xl mb-3">🛒</div>
          <p class="font-bold text-gray-400">السلة فارغة</p>
          <p class="text-xs text-gray-300 mt-1">أضف منتجات من المنيو</p>
        </div>`
      grandTotal.textContent = `0 ج.م`
      return
    }

    container.innerHTML = state.cart.map(c => `
      <div class="flex items-center gap-3 bg-gray-50 rounded-2xl p-3">
        ${c.product.image_url
          ? `<img src="${c.product.image_url}" class="w-14 h-14 rounded-xl object-cover flex-shrink-0" />`
          : `<div class="w-14 h-14 rounded-xl bg-gray-200 flex items-center justify-center text-2xl flex-shrink-0">🍽️</div>`
        }
        <div class="flex-1 min-w-0">
          <p class="font-bold text-gray-800 text-sm leading-tight truncate">${c.product.name}</p>
          <p class="brand-text text-xs font-bold mt-0.5">${fmt(c.product.price * c.qty)}</p>
        </div>
        <div class="flex items-center gap-1.5 flex-shrink-0">
          <button onclick="changeQty('${c.product.id}',-1)"
                  class="w-8 h-8 rounded-xl bg-white border border-gray-200 text-gray-600 font-bold
                         flex items-center justify-center shadow-sm">−</button>
          <span class="w-5 text-center font-extrabold text-sm text-gray-800">${c.qty}</span>
          <button onclick="changeQty('${c.product.id}',1)"
                  class="brand-bg w-8 h-8 rounded-xl text-white font-bold flex items-center justify-center">+</button>
        </div>
      </div>`).join('')

    grandTotal.textContent = fmt(total)
  }

  // ─────────────────────────────────
  // 13. SEND ORDER
  // ─────────────────────────────────
  async function sendOrder() {
    if (!state.cart.length) return

    const btn = document.getElementById('send-order-btn')
    btn.disabled = true
    btn.innerHTML = '<span class="opacity-70">جاري الإرسال...</span>'

    const tableNumber = document.getElementById('table-number-input').value.trim()

    const items = state.cart.map(c => ({
      id:       c.product.id,
      name:     c.product.name,
      price:    Number(c.product.price),
      qty:      c.qty,
      subtotal: Number((c.product.price * c.qty).toFixed(2))
    }))

    const total = cartTotal()
    let orderNumber = 'TMP-' + Date.now()

    try {
      const { data: rpcData, error: rpcErr } = await db.rpc('generate_order_number')
      if (!rpcErr && rpcData) {
        const { data: orderData } = await db.from('orders').insert({
          restaurant_id: state.restaurant.id,
          order_number:  rpcData,
          items, total,
          table_number: tableNumber || null
        }).select('order_number').single()
        if (orderData?.order_number) orderNumber = orderData.order_number
      }
    } catch(e) {
      console.warn('Order save failed:', e)
    }

    const now = new Date().toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' })
    const lines = [
      `🧾 *طلب جديد ${orderNumber}*`,
      `─────────────────`,
      ...items.map(i => `• ${i.name} × ${i.qty}  —  ${fmt(i.subtotal)}`),
      `─────────────────`,
      `💰 *الإجمالي: ${fmt(total)}*`,
      tableNumber ? `📍 الطاولة: ${tableNumber}` : '',
      `⏰ ${now}`
    ].filter(Boolean).join('\n')

    window.open(`https://wa.me/${state.restaurant.whatsapp}?text=${encodeURIComponent(lines)}`, '_blank')

    state.cart = []
    updateCartUI()
    closeCartSheet()
    btn.disabled = false
    btn.innerHTML = '<span>إرسال الطلب عبر واتساب</span><span class="text-xl">📲</span>'
  }

  // ─────────────────────────────────
  // 14. HELPERS
  // ─────────────────────────────────
  function fmt(val) {
    return `${Number(val).toFixed(0)} ج.م`
  }

  function showState(name) {
    ['loading','error','app'].forEach(s =>
      document.getElementById(`state-${s}`).classList.add('hidden'))
    document.getElementById(`state-${name}`).classList.remove('hidden')
  }

  function showError(msg) {
    document.getElementById('error-msg').textContent = msg
    showState('error')
  }

  // ─────────────────────────────────
  // START
  // ─────────────────────────────────
  if (document.referrer.includes('dashboard')) {
    document.getElementById('back-to-dash').classList.remove('hidden')
  }
  boot()
  </script>
</body>
</html>
